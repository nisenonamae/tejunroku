<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手順録</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D2730">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E9EC; --sheet:#FBFCFC; --ink:#1D2730; --sub:#5A6670; --line:#C3CDD3;
  --accent:#2B57A3; --fork:#A0600C; --forkbg:#F5ECDF; --ok:#2E7A57; --warn:#B0322A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.6;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) calc(72px + env(safe-area-inset-bottom,0)) env(safe-area-inset-left,0)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 上の帯 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--ink);color:#fff}
.top h1{margin:0;font-size:1.25rem;letter-spacing:.08em}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.tabs button{background:none;border:0;color:#B9C5CD;padding:6px 10px;border-radius:4px}
.tabs button[aria-current="page"]{color:#fff;background:#33414C}
.connbtn{background:none;border:1px solid #6A7A86;color:#fff;border-radius:4px;padding:4px 10px;font-size:.875rem}
.status{padding:6px 16px;font-size:.875rem;color:var(--sub);min-height:1.6em}
.status.err{color:var(--warn);font-weight:700}

main{max-width:1180px;margin:0 auto;padding:4px 16px 24px}

/* 接続 */
.conn{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:8px 0 12px;max-width:560px}
.conn h2{margin:0 0 8px;font-size:1rem}
.conn label{display:block;margin:6px 0;font-size:.875rem;color:var(--sub)}
.conn input{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:1rem}
.conn .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ver{font-size:.875rem;color:var(--sub)}

.btn{border:1px solid var(--ink);background:#fff;border-radius:4px;padding:6px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--sub)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}

/* 一覧 */
.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
.listhead h2{margin:0;font-size:1.125rem}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{text-align:left;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:4px;padding:10px 12px}
.pcard:hover{border-color:var(--ink)}
.pcard b{display:block;font-size:1.0625rem}
.pcard span{font-size:.8125rem;color:var(--sub)}
.pcard .unsaved{color:var(--fork);font-weight:700}
.empty{color:var(--sub);background:var(--sheet);border:1px dashed var(--line);border-radius:6px;padding:18px}

/* 編集 */
.edhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 12px}
.edhead .name{flex:1 1 220px;font-size:1.25rem;font-weight:700;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.pvwrap{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
@media (max-width:760px){
  .grid{grid-template-columns:1fr;gap:12px}
  .pvwrap{top:0;max-height:42vh;z-index:5;box-shadow:0 6px 10px -8px rgba(29,39,48,.5)}
  .top{padding:8px 12px}
  .connbtn{margin-left:auto}
  .tabs{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto}
  .tabs button{white-space:nowrap}
  .edhead .name{flex-basis:100%;order:-1}
  .edhead [data-act="back"]{margin-right:auto}
}

/* 見本 */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px}
.sheet .sh-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.sheet .sh-title b{font-size:1.0625rem}
.sheet .sh-title span{font-size:.8125rem;color:var(--sub)}
.sheet .sh-note{font-size:.75rem;color:var(--sub);margin:0 0 8px}
.pv-list{list-style:none;margin:0;padding:0 0 0 26px;position:relative}
.pv-list::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--ink)}
.pv-list.inner{margin:6px 0 2px;padding-left:24px}
.pv-list.inner::before{background:var(--fork)}
.pv-step{position:relative;padding:3px 0 9px}
.pv-num{font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.pv-check{position:absolute;left:-26px;top:4px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);padding:0}
.pv-list.inner > .pv-step > .pv-check{left:-24px;border-color:var(--fork)}
.pv-step.done > .pv-check{background:var(--ok);border-color:var(--ok)}
.pv-step.done > .pv-body .pv-text{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}
.pv-body{cursor:pointer}
.pv-min{font-size:.8125rem;color:var(--sub);margin-left:6px;white-space:nowrap}
.pv-blank{color:var(--sub)}
.pv-step.br > .pv-mark{position:absolute;left:-23px;top:7px;width:14px;height:14px;background:var(--fork);transform:rotate(45deg)}
.pv-q{font-weight:700}
.pv-opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.pv-opts button{border:1.5px solid var(--fork);color:var(--fork);background:#fff;border-radius:999px;padding:2px 12px;font-size:.9375rem}
.pv-opts button[aria-pressed="true"]{background:var(--fork);color:#fff}
.pv-hint{font-size:.8125rem;color:var(--sub);margin:2px 0 0}
.rng{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:0 5px;font-size:.875em;line-height:1.4}

/* 手順の並び */
.st{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:4px;padding:8px 10px;margin:0 0 8px}
.st.br{background:var(--forkbg);border-left-color:var(--fork)}
.st.pt{border-left-color:var(--accent)}
.st.flash{outline:3px solid var(--accent)}
.st-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.st-num{font-weight:700;min-width:2.2em;font-variant-numeric:tabular-nums}
.st-kind{font-size:.8125rem;color:var(--sub)}
.st.br > .st-head .st-kind{color:var(--fork);font-weight:700}
.tools{margin-left:auto;display:flex;gap:4px}
.tools button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:4px;min-width:34px;height:30px;padding:0 6px;font-size:.8125rem;color:var(--sub)}
.tools button:disabled{opacity:.35;cursor:default}
.st textarea,.st input[type=text]{width:100%;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fff;resize:vertical}
.st textarea{min-height:2.6em;line-height:1.5}
.min{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.875rem;color:var(--sub)}
.min input{width:5.5em;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:#fff}
.opt{border-left:2px dashed var(--fork);margin:10px 0 4px 2px;padding-left:10px}
.opt-head{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.opt-head input{flex:1}
.opt-head span{font-size:.8125rem;color:var(--fork);white-space:nowrap}
.opt-head button{border:1px solid var(--line);background:#fff;border-radius:4px;font-size:.8125rem;color:var(--sub);padding:3px 8px;white-space:nowrap}
.addbar{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.addbar button{border:1px dashed var(--sub);background:transparent;border-radius:4px;padding:4px 10px;font-size:.875rem;color:var(--ink)}
.addbar button.fork{border-color:var(--fork);color:var(--fork)}
.st.br > .addopt{border:1px dashed var(--fork);background:transparent;color:var(--fork);border-radius:4px;padding:3px 10px;font-size:.875rem;margin-top:2px}
.merge{font-size:.75rem;color:var(--sub);margin:6px 0 0}

/* 準備中 */
.later{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;max-width:620px}

/* 保存の帯 */
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0));background:var(--ink);color:#fff;z-index:20}
.bar[hidden]{display:none}
.bar .btn.primary{border-color:#fff}
select{border:1px solid var(--line);border-radius:4px;padding:5px 6px;background:#fff;max-width:100%}
.info{font-size:.875rem;color:var(--sub);margin:-4px 0 12px}
.box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 12px}
.box h3{margin:0 0 8px;font-size:1rem}
.note{font-size:.8125rem;color:var(--sub);margin:0 0 8px}
.irow{display:grid;grid-template-columns:2em minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;margin:0 0 6px}
@media (max-width:520px){.irow{grid-template-columns:2em minmax(0,1fr) auto;margin-bottom:10px}.irow .tools{grid-column:3;grid-row:1}.irow select{grid-column:2 / 4;grid-row:2}}
.irow input,.rrow input[type=text]{border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;background:#fff}
.rrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.rrow > input[type=text]{flex:1 1 200px;width:auto}
.rrow label{font-size:.875rem;color:var(--sub)}
.rrow input[type=number]{width:7em;border:1px solid var(--line);border-radius:4px;padding:5px 6px}
.add2{border:1px dashed var(--sub);background:transparent;border-radius:4px;padding:4px 10px;font-size:.875rem}
.small{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 8px;font-size:.8125rem;color:var(--sub)}
.ring{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.ring button{border:1.5px solid var(--ink);background:#fff;border-radius:4px;padding:2px 10px}
.ring button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ring .arw{color:var(--sub)}
.ring .loop{font-size:.8125rem;color:var(--sub)}
.sub-title{font-weight:700;margin:4px 0 8px;font-size:.9375rem}
.pv-step.pt > .pv-mark{position:absolute;left:-23px;top:7px;width:14px;height:14px;background:var(--accent)}
.pv-list.inner.part::before{background:var(--accent)}
.pv-list.inner.part > .pv-step > .pv-check{border-color:var(--accent)}
.pt-sum{margin:4px 0 6px;padding-left:1.4em;font-size:.875rem;color:var(--sub)}
.addbar select{border:1px dashed var(--accent);color:var(--accent);background:transparent;font-size:.875rem;padding:4px 6px}
.rng.missing{border-color:var(--warn);color:var(--warn)}
.big{font-size:1.75rem;font-weight:700;line-height:1.3;margin:4px 0}
.meter{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.fields label{font-size:.8125rem;color:var(--sub);display:block}
.fields input,.fields select{display:block;width:100%;margin-top:2px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:1rem;color:var(--ink);background:#fff}
.warnline{color:var(--warn);font-size:.875rem;margin:6px 0 0}
.warnline:empty{display:none}
.lrow{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:4px;padding:10px 12px;margin:0 0 8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px 14px;align-items:center}
@media (max-width:760px){.lrow{grid-template-columns:1fr}}
.lrow .lt b{display:block}
.lrow .lt span,.lrow .lc span{font-size:.8125rem;color:var(--sub)}
.lrow label{font-size:.8125rem;color:var(--sub)}
.lrow select{display:block;width:100%;margin-top:2px;font-size:.9375rem;color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font-size:.875rem}
.edhead h2{margin:0;font-size:1.25rem;flex:1 1 200px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.guide{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:8px 14px;margin:0 0 14px;max-width:760px}
.guide summary{cursor:pointer;font-weight:700;padding:2px 0}
.guide ol{margin:8px 0 6px;padding-left:1.4em}
.guide li{margin:4px 0}
.guide p{margin:6px 0 4px;font-size:.875rem;color:var(--sub)}
.tpick{margin-top:4px}
.tp-bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tp-bar input{flex:1 1 200px;border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:#fff;font-size:1rem}
.tp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;max-height:320px;overflow:auto}
.tp-list .note{grid-column:1 / -1}
.tp-item{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:4px;padding:7px 10px}
.tp-item:hover{border-color:var(--ink)}
.tp-item span{font-size:.75rem;color:var(--sub);white-space:nowrap}
details.addtask summary{cursor:pointer;font-weight:700}
details.addtask[open] summary{margin-bottom:8px}
.lrow.flash,.flash{outline:3px solid var(--accent)}
.pcard .meter{margin:6px 0 0}
</style>
</head>
<body>
<header class="top">
  <h1>手順録</h1>
  <nav class="tabs" id="tabs" aria-label="タブ"></nav>
  <button class="connbtn" id="connToggle" type="button">接続</button>
</header>
<div class="status" id="status" role="status" aria-live="polite"></div>
<main>
  <section class="conn" id="conn" hidden>
    <h2>接続</h2>
    <label>リポジトリ(持ち主/名前)<input id="cRepo" type="text" autocomplete="off" spellcheck="false" placeholder="nisenonamae/notion-daily"></label>
    <label>トークン<input id="cToken" type="password" autocomplete="off" spellcheck="false"></label>
    <div class="row">
      <button class="btn primary" id="cGo" type="button">つないで読み込む</button>
      <span class="ver" id="ver"></span>
    </div>
  </section>
  <div id="view"></div>
</main>
<div class="bar" id="bar" hidden>
  <span id="barText"></span>
  <button class="btn primary" id="saveBtn" type="button">保存する</button>
</div>

<script src="core.js"></script>
<script>
'use strict';
const APP_VERSION = 3;
const C = window.TJCore;
const BASE = 'roadmap/apps/tejunroku';
const DATA_PATH = BASE + '/data.json', RUNS_DIR = BASE + '/runs';
const DEFS_PATH = 'roadmap/tasks/defs.json', OVERLAY_PATH = 'roadmap/tasks/overlay.json';
const LS_CONN = 'tejunroku.conn', LS_CACHE = 'tejunroku.cache';
const DEFAULT_REPO = 'nisenonamae/notion-daily';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = C.uid, clone = C.clone;
const se = name => { try { if (typeof SE !== 'undefined') SE.play(name); } catch (e) {} };   // 効果音(下の方で用意する)
const md = d => d ? (+d.slice(5, 7)) + '月' + (+d.slice(8, 10)) + '日' : '';

/* ---------- 文字と base64 ---------- */
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = b => decodeURIComponent(escape(atob(String(b).replace(/\s/g, ''))));

/* ---------- GitHub ---------- */
function getConn() { try { return JSON.parse(localStorage.getItem(LS_CONN)) || {}; } catch (e) { return {}; } }
function httpErr(status) { const e = new Error(''); e.status = status; return e; }
function errMsg(e) {
  const s = e && e.status;
  if (s === 401) return 'トークンが正しくありません。接続の欄で入れ直してください。';
  if (s === 403) return 'このトークンでは書き込めません(権限か、回数の上限)。';
  if (s === 404) return 'リポジトリが見つかりません。接続の欄を確かめてください。';
  if (s === 409 || s === 422) return '他の端末の保存と3回続けてぶつかりました。少し待ってからもう一度保存してください。';
  if (s === 'noconn') return 'まだつないでいません。接続の欄でリポジトリとトークンを入れてください。';
  if (s) return 'GitHubとのやりとりに失敗しました(' + s + ')。';
  return 'GitHubにつながりませんでした。電波を確かめて、もう一度試してください。';
}
const gh = {
  repoOk: false,
  api(path) { const c = getConn(); return 'https://api.github.com/repos/' + c.repo + (path ? '/contents/' + path.split('/').map(encodeURIComponent).join('/') : ''); },
  headers() { return { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + getConn().token }; },
  check() { const c = getConn(); if (!c.repo || !c.token) throw httpErr('noconn'); },
  async get(path) {
    this.check();
    const r = await fetch(this.api(path), { headers: this.headers(), cache: 'no-store' });
    if (r.status === 404) {
      // ファイルが無いのか、リポジトリが無いのかを見分ける
      if (!this.repoOk) { const rr = await fetch(this.api(''), { headers: this.headers(), cache: 'no-store' }); if (!rr.ok) throw httpErr(rr.status); this.repoOk = true; }
      return null;
    }
    if (!r.ok) throw httpErr(r.status);
    this.repoOk = true;
    return r.json();
  },
  async read(path) {
    const j = await this.get(path);
    if (!j) return { json: null, sha: null };
    return { json: JSON.parse(b64dec(j.content || '') || 'null'), sha: j.sha };
  },
  async list(dir) { const j = await this.get(dir); return Array.isArray(j) ? j : []; },
  async write(path, obj, sha, message) {
    this.check();
    const body = { message, content: b64enc(JSON.stringify(obj, null, 2) + '\n') };
    if (sha) body.sha = sha;
    const r = await fetch(this.api(path), { method: 'PUT', headers: Object.assign(this.headers(), { 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
    if (!r.ok) throw httpErr(r.status);
    const j = await r.json();
    return j.content && j.content.sha;
  }
};
// 読み直し→変更を当てる→書く。ぶつかったら最大3回
async function commit(mutate, message) {
  let last;
  for (let i = 0; i < 3; i++) {
    const { json, sha } = await gh.read(DATA_PATH);
    const data = C.normalize(json);
    mutate(data);
    try { return { data, sha: await gh.write(DATA_PATH, data, sha, message) }; }
    catch (e) { last = e; if (e.status === 409 || e.status === 422) continue; throw e; }
  }
  throw last;
}

/* ---------- 手順の木の操作 ---------- */
function locate(proc, id) {
  let r = null;
  C.walk(proc.steps, (s, list, index) => { if (s.id === id) { r = { step: s, list, index }; return false; } });
  return r;
}
function locateOpt(proc, optId) {
  let r = null;
  C.walk(proc.steps, s => {
    if (s.type === 'branch') {
      const index = s.options.findIndex(o => o.id === optId);
      if (index >= 0) { r = { branch: s, option: s.options[index], index }; return false; }
    }
  });
  return r;
}
function listByKey(proc, key) { if (key === 'root') return proc.steps; const r = locateOpt(proc, key); return r ? r.option.steps : null; }
function newStep(type) {
  if (type === 'branch') return { id: uid('s'), type: 'branch', question: '', options: [
    { id: uid('o'), label: 'はい', steps: [] }, { id: uid('o'), label: 'いいえ', steps: [] }] };
  return { id: uid('s'), type: 'do', text: '', min: null };
}
function renewIds(step) {
  const s = clone(step);
  (function re(x) { x.id = uid('s'); if (x.type === 'branch') for (const o of x.options) { o.id = uid('o'); o.steps.forEach(re); } })(s);
  return s;
}
function removeWhere(steps, pred) {
  for (let i = steps.length - 1; i >= 0; i--) {
    if (pred(steps[i])) steps.splice(i, 1);
    else if (steps[i].type === 'branch') steps[i].options.forEach(o => removeWhere(o.steps, pred));
  }
}
const ops = {
  add(proc, key, type) { const list = listByKey(proc, key); if (!list) return null; const s = newStep(type); list.push(s); return s; },
  addPart(proc, key, partId) { const list = listByKey(proc, key); if (!list) return null; const s = { id: uid('s'), type: 'part', partId }; list.push(s); return s; },
  move(proc, id, dir) {
    const l = locate(proc, id); if (!l) return false;
    const j = l.index + dir; if (j < 0 || j >= l.list.length) return false;
    l.list.splice(l.index, 1); l.list.splice(j, 0, l.step); return true;
  },
  remove(proc, id) { const l = locate(proc, id); if (!l) return false; l.list.splice(l.index, 1); return true; },
  dup(proc, id) { const l = locate(proc, id); if (!l) return null; const c = renewIds(l.step); l.list.splice(l.index + 1, 0, c); return c; },
  addOpt(proc, branchId) {
    const l = locate(proc, branchId); if (!l || l.step.type !== 'branch') return null;
    const o = { id: uid('o'), label: '', steps: [] }; l.step.options.push(o); return o;
  },
  removeOpt(proc, optId) {
    const r = locateOpt(proc, optId); if (!r || r.branch.options.length <= 1) return false;
    r.branch.options.splice(r.index, 1); return true;
  }
};

/* ---------- 状態 ---------- */
const S = { data: C.emptyData(), sha: null, dirty: new Set(), removed: new Set(),
  tab: 'procs', open: { procs: null, parts: null, cycles: null, ranges: null },
  pick: {}, checks: {}, cyPick: 0, saving: false, connOpen: false,
  tasks: [], tasksMsg: '', runs: {}, runsState: '', linkRows: new Set(), tq: {} };
const COLLS = ['procs', 'parts', 'ranges', 'cycles', 'links'];
const key = (c, id) => c + ':' + id;
const splitKey = k => { const i = k.indexOf(':'); return [k.slice(0, i), k.slice(i + 1)]; };
function getItem(c, id) { if (c === 'links') return S.data.links[id]; return (S.data[c] || []).find(x => x.id === id) || null; }
function putItem(d, c, id, item) {
  if (c === 'links') { if (item == null) delete d.links[id]; else d.links[id] = item; return; }
  const a = d[c], i = a.findIndex(x => x.id === id);
  if (item == null) { if (i >= 0) a.splice(i, 1); return; }
  if (i >= 0) a[i] = clone(item); else a.push(clone(item));
}
function applyLocal(d) {
  for (const k of S.dirty) { const [c, id] = splitKey(k); putItem(d, c, id, getItem(c, id)); }
  for (const k of S.removed) { const [c, id] = splitKey(k); putItem(d, c, id, null); }
}
let cacheTimer = null;
function saveCache() {
  clearTimeout(cacheTimer); cacheTimer = null;
  try { localStorage.setItem(LS_CACHE, JSON.stringify({ data: S.data, sha: S.sha, dirty: [...S.dirty], removed: [...S.removed], tasks: S.tasks })); } catch (e) {}
}
function saveCacheSoon() { clearTimeout(cacheTimer); cacheTimer = setTimeout(saveCache, 400); }
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(LS_CACHE)); if (!c) return;
    const fix = k => k.includes(':') ? k : 'procs:' + k; // 版1の下書きは手順書だけだった
    S.data = C.normalize(c.data); S.sha = c.sha || null;
    S.dirty = new Set((c.dirty || []).map(fix)); S.removed = new Set((c.removed || []).map(fix));
    S.tasks = Array.isArray(c.tasks) ? c.tasks : [];
  } catch (e) {}
}
function touch(c, id) { const k = key(c, id); S.removed.delete(k); S.dirty.add(k); saveCacheSoon(); renderBar(); }
function drop(c, id) { const k = key(c, id); S.dirty.delete(k); S.removed.add(k); saveCacheSoon(); renderBar(); }
function changeCount() { return S.dirty.size + S.removed.size; }
const isDirty = (c, id) => S.dirty.has(key(c, id));
function setStatus(msg, err) { const el = $('#status'); el.textContent = msg || ''; el.classList.toggle('err', !!err); }

/* ---------- 引くための関数 ---------- */
const findTask = tid => S.tasks.find(x => x.id === tid) || null;
function taskName(tid) { const t = findTask(tid); return t ? t.name : '見つからないタスク'; }
const cycleOf = tid => S.data.cycles.find(c => c.taskId === tid) || null;
const rangeByName = n => S.data.ranges.find(r => r.name === n) || null;
function procUses(pid) {
  const out = [];
  for (const [tid, p] of Object.entries(S.data.links)) if (p === pid) out.push(taskName(tid));
  for (const c of S.data.cycles) for (const it of c.items) if (it.procId === pid) out.push(taskName(c.taskId) + 'の「' + (it.name || '名前なし') + '」');
  return out;
}
function partUses(partId) {
  return S.data.procs.filter(p => { let f = false; C.walk(p.steps, s => { if (s.type === 'part' && s.partId === partId) { f = true; return false; } }); return f; });
}
const textOf = s => s.type === 'do' ? s.text : s.type === 'branch' ? s.question : '';
function rangeUses(name) {
  const out = [];
  for (const coll of ['procs', 'parts']) for (const p of S.data[coll]) {
    let n = 0; C.walk(p.steps, s => { n += C.rangeNamesIn(textOf(s)).filter(x => x === name).length; });
    if (n) out.push({ coll, p, n });
  }
  return out;
}
const rState = r => C.rangeState(r, S.runs);
const rPct = (st) => st.finished ? 100 : Math.round(st.done / st.total * 100);

/* ---------- 読み込みと保存 ---------- */
async function loadTasks() {
  try {
    const [a, b] = await Promise.all([gh.read(DEFS_PATH), gh.read(OVERLAY_PATH)]);
    S.tasks = C.taskList(a.json, b.json);
    S.tasksMsg = S.tasks.length ? '' : 'タスクの定義がまだありません。行軍表でタスクを取り込むと、ここで選べます。';
  } catch (e) { S.tasksMsg = 'タスクの定義を読めませんでした。' + errMsg(e); }
}
async function loadRuns() {
  const since = C.rangeSinceMonth(S.data.ranges);
  if (since === null) { S.runs = {}; S.runsState = 'ok'; return; }
  try {
    const files = await gh.list(RUNS_DIR);
    const ms = files.map(f => f.name).filter(n => /^\d{4}-\d{2}\.json$/.test(n)).map(n => n.slice(0, 7)).filter(m => !since || m >= since);
    const res = await Promise.all(ms.map(m => gh.read(RUNS_DIR + '/' + m + '.json')));
    const runs = {}; ms.forEach((m, i) => { runs[m] = res[i].json || {}; });
    S.runs = runs; S.runsState = 'ok';
  } catch (e) { S.runsState = 'err'; }
}
async function load() {
  setStatus('読み込み中…');
  try {
    const { json, sha } = await gh.read(DATA_PATH);
    const d = C.normalize(json);
    applyLocal(d);
    S.data = d; S.sha = sha;
    await Promise.all([loadTasks(), loadRuns()]);
    setStatus(json ? '読み込みました。' : 'まだデータがありません。最初に保存したときに作ります。');
  } catch (e) { setStatus(errMsg(e), true); if (e.status === 'noconn' || e.status === 401 || e.status === 404) S.connOpen = true; }
  saveCache(); render();
}
async function save() {
  if (!changeCount() || S.saving) return;
  S.saving = true; renderBar(); setStatus('保存中…');
  const snap = new Map([...S.dirty].map(k => { const [c, id] = splitKey(k); return [k, clone(getItem(c, id))]; }));
  const rem = new Set(S.removed);
  const n = snap.size + rem.size;
  try {
    const { data, sha } = await commit(d => {
      for (const [k, item] of snap) { const [c, id] = splitKey(k); putItem(d, c, id, item); }
      for (const k of rem) { const [c, id] = splitKey(k); putItem(d, c, id, null); }
    }, '手順録: ' + n + '件の変更');
    // 保存中に直したものは残す
    for (const k of [...S.dirty]) {
      const [c, id] = splitKey(k), now = getItem(c, id);
      if (snap.has(k) && JSON.stringify(now) === JSON.stringify(snap.get(k))) S.dirty.delete(k);
      else putItem(data, c, id, now);
    }
    for (const k of rem) S.removed.delete(k);
    for (const k of S.removed) { const [c, id] = splitKey(k); putItem(data, c, id, null); }
    S.data = data; S.sha = sha;
    setStatus('保存しました。'); se('save');
  } catch (e) { setStatus(errMsg(e), true); if (e.status === 'noconn' || e.status === 401) S.connOpen = true; }
  S.saving = false; saveCache(); render();
}

/* タスクを選ぶところ。名前と省で絞り込める */
const PICKERS = {};
const hira = s => String(s || '').toLowerCase().replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const byMinName = (a, b) => (a.ministry || '').localeCompare(b.ministry || '', 'ja') || a.name.localeCompare(b.name, 'ja');

function pickerList(id) {

/* 見本 */
function rangeChip(name) {
  const r = rangeByName(name);
  if (!r) return `<span class="rng missing" title="この名前の範囲がありません(範囲のタブで作ります)">${esc(name)}</span>`;
  return `<span class="rng" title="範囲「${esc(name)}」の今日の分">${esc(name)} ${esc(C.rangeText(r, rState(r)))}</span>`;
}
function richText(t) {
  t = String(t); let out = '', last = 0;
  t.replace(C.RANGE_RE, (m, name, idx) => { out += esc(t.slice(last, idx)) + rangeChip(name); last = idx + m.length; return m; });
  return out + esc(t.slice(last));
}
function previewHead(title, steps) {
  const whole = C.fmtSpan(C.span(steps, S.data));
  let chosen = '';
  if (C.hasBranch(steps, S.data) && C.allPicked(steps, S.pick, S.data)) { const c = C.fmtSpan(C.span(steps, S.data, S.pick)); chosen = c ? '選んだ道では ' + c : ''; }
  return `<div class="sh-title"><b>${esc(title)}</b><span class="pvTotal">${whole ? '合計 ' + whole : ''}${chosen ? '(' + chosen + ')' : ''}</span></div>`;
}
function renderPreview() {
  const p = cur(); const pv = $('#pv'); if (!p || !pv) return;
  pv.innerHTML = previewHead(p.name || '名前なし', p.steps) +
    `<p class="sh-note">実行したときの見本です。丸を押すと済みの印、分かれ道は選ぶと先が出ます(どちらも保存はしません)。</p>` +
    (p.steps.length ? pvList(p.steps, C.numbering(p.steps, S.data), '') : `<p class="pv-hint">右(スマホでは下)で手順を足すと、ここに出ます。</p>`);
}
function pvList(steps, labels, inner) {
  return `<ol class="pv-list${inner ? ' inner ' + inner : ''}">` + steps.map(s => pvStep(s, labels)).join('') + `</ol>`;
}
function pvStep(s, labels) {
  const num = `<span class="pv-num">${labels[s.id] || ''}</span>`;
  if (s.type === 'branch') {
    const o = s.options.find(o => o.id === S.pick[s.id]);
    return `<li class="pv-step br" data-id="${s.id}"><span class="pv-mark"></span>
      <div class="pv-body" data-pv="jump" data-id="${s.id}">${num}<span class="pv-q">${s.question ? richText(s.question) : '<span class="pv-blank">(問いを書いていません)</span>'}</span></div>
      <div class="pv-opts">` + s.options.map(x => `<button type="button" data-pv="pick" data-id="${s.id}" data-opt="${x.id}" aria-pressed="${o === x}">${esc(x.label || '名前なし')}</button>`).join('') + `</div>` +
      (o ? (o.steps.length ? pvList(o.steps, labels, 'fork') : `<p class="pv-hint">この道には手順がありません。そのまま次へ進みます。</p>`)
         : `<p class="pv-hint">選ぶと、その先の手順が出ます。</p>`) + `</li>`;
  }
  if (s.type === 'part') {
    const pt = getItem('parts', s.partId), inner = C.expandPart(s, S.data);
    return `<li class="pv-step pt" data-id="${s.id}"><span class="pv-mark"></span>
      <div class="pv-body" data-pv="jump" data-id="${s.id}">${num}<span class="pv-q">${esc(pt ? pt.name || '名前なし' : '見つからない部品')}</span></div>` +
      (inner.length ? pvList(inner, labels, 'part') : '') + `</li>`;
  }
  const done = !!S.checks[s.id];
  return `<li class="pv-step do${done ? ' done' : ''}" data-id="${s.id}">
    <button type="button" class="pv-check" data-pv="check" data-id="${s.id}" aria-pressed="${done}" aria-label="済みの印"></button>
    <div class="pv-body" data-pv="jump" data-id="${s.id}">${num}<span class="pv-text">${s.text ? richText(s.text) : '<span class="pv-blank">(まだ書いていません)</span>'}</span>${s.min ? `<span class="pv-min">${C.fmtMin(+s.min)}</span>` : ''}</div></li>`;
}

/* ---------- 操作 ---------- */
function openItem(tab, id) { S.tab = tab; S.open[tab] = id; S.pick = {}; S.checks = {}; S.cyPick = 0; render(); window.scrollTo(0, 0); }
function focusStep(id) {
  const el = document.getElementById('ed-' + id); if (!el) return;
  const f = el.querySelector('textarea, input[type=text]'); if (f) f.focus({ preventScroll: true });
  el.scrollIntoView && el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function flash(id) {
  const el = document.getElementById('ed-' + id); if (!el) return;
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
  el.scrollIntoView && el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
const hasInner = step => step.type === 'branch' && step.options.some(o => o.steps.length);

function deleteProc(p) {
  const u = procUses(p.id);
  if (!confirm('「' + (p.name || '名前なし') + '」を消しますか?' + (u.length ? '\n結びつき(' + u.join('、') + ')も外します。' : ''))) return false;
  for (const [tid, pid] of Object.entries(S.data.links)) if (pid === p.id) { delete S.data.links[tid]; touch('links', tid); }
  for (const c of S.data.cycles) if (c.items.some(i => i.procId === p.id)) { c.items.forEach(i => { if (i.procId === p.id) i.procId = null; }); touch('cycles', c.id); }
  S.data.procs.splice(S.data.procs.indexOf(p), 1); drop('procs', p.id);
  return true;
}
function deletePart(p) {
  const u = partUses(p.id);
  if (!confirm('部品「' + (p.name || '名前なし') + '」を消しますか?' + (u.length ? '\n使っている手順書(' + u.map(x => x.name || '名前なし').join('、') + ')からも外します。' : ''))) return false;
  for (const q of u) { removeWhere(q.steps, s => s.type === 'part' && s.partId === p.id); touch('procs', q.id); }
  S.data.parts.splice(S.data.parts.indexOf(p), 1); drop('parts', p.id);
  return true;
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; S.pick = {}; S.checks = {}; render(); return; }
  const pvb = e.target.closest('[data-pv]');
  if (pvb) {
    const id = pvb.dataset.id, again = S.tab === 'cycles' ? renderCyclePreview : renderPreview;
    if (pvb.dataset.pv === 'pick') { S.pick[id] = S.pick[id] === pvb.dataset.opt ? undefined : pvb.dataset.opt; again(); }
    else if (pvb.dataset.pv === 'check') { S.checks[id] = !S.checks[id]; again(); }
    else if (pvb.dataset.pv === 'cy') { S.cyPick = +pvb.dataset.i; S.pick = {}; S.checks = {}; renderCyclePreview(); }
    else if (pvb.dataset.pv === 'jump') flash(id);
    return;
  }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;

  // どのタブでも
  if (act === 'back') { S.open[S.tab] = null; render(); return; }
  if (act === 'openpart') { openItem('parts', b.dataset.id); return; }
  if (act === 'cy-open') { openItem('cycles', b.dataset.id); return; }
  if (act === 'ln-add') {
    S.linkRows.add(b.dataset.tid); render();

    const b = row.querySelector("#se-on"), r = row.querySelector("#se-vol");
    const show = () => { b.textContent = on ? "入" : "切"; b.setAttribute("aria-pressed", String(on)); r.value = vol; r.disabled = !on; };
    b.addEventListener("click", () => { on = !on; try { localStorage.setItem("se-on", on ? "1" : "0"); } catch (e) {} show(); if (on) play("toggleOn"); });
    r.addEventListener("input", () => { vol = +r.value; try { localStorage.setItem("se-vol", String(vol)); } catch (e) {} });
    r.addEventListener("change", () => play("done"));
    show();
  }
  return { play, init, mount, soundFor, get on(){ return on; } };
})();

SE.init([
  ['[data-act="example"], [data-act="cy-example"]', 'levelup'],
  ['#saveBtn', 'send'],
  ['[data-pv="check"]', el => el.getAttribute('aria-pressed') === 'true' ? 'down' : 'done'],
  ['[data-pv="pick"], [data-act="add"][data-type="do"], [data-act="cy-add"], [data-act="rule-add"], [data-act="addopt"], [data-act="dup"], [data-act="dupitem"]', 'pluck'],
  ['[data-act="add"][data-type="branch"], [data-act="ln-add"], [data-act="rg-set"]', 'link'],
  ['[data-act="del"], [data-act="delopt"], [data-act="delitem"], [data-act="cy-rm"], [data-act="rule-rm"], [data-act="cy-del"], [data-act="rg-del"]', 'remove'],
  ['[data-act="newitem"], [data-act="rg-new"], [data-act="cy-new-for"], [data-act="open"], [data-act="cy-open"], [data-act="rg-open"], [data-act="openpart"], #cGo', 'open'],
  ['[data-act="back"]', 'down'],
  ['[data-pv="cy"], [data-tab]', 'tab'],
]);
// 効果音の入/切・音量は、接続の欄の版の表示のそばに置く(行軍表・省・思案と共通の設定)
(function(){ const go = () => SE.mount(document.querySelector('#conn .row'));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go(); })();
</script>
